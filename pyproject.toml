[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mega-trading"
version = "0.1.0"
description = "A foundation model of trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "binance-datatool>=0.1.1",
    "certifi>=2026.4.22",
    "hydra-core>=1.3.2",
    "mlflow>=3.12.0",
    "modal>=1.4.2",
    "numpy>=2.4.4",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = []

[project.scripts]
mega-trading = "mega_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
