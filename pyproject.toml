[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketfm-forge"
version = "0.1.0"
description = "Data and training infrastructure prototype for a finance foundation model lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marketfm = "marketfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
