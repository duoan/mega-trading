defaults:
  - _self_

run:
  run_id: smoke

data:
  data_dir: .mega-trading/demo
  mixture: public
  source: fixture

build:
  block_size: 128
  stride: 64
  min_events_per_ticker: 32
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 16
  tokenizer_price_bins: 16
  tokenizer_size_bins: 16
  tokenizer_time_bins: 4
  numpy_partition_rows: null
  validation_fraction: 0.1
  backtest_fraction: 0.1
  streaming_prepare: false
  streaming_tokenizer_sample_events: 250000
  streaming_baseline_sample_rows: 200000

model:
  hidden_dim: 128
  layers: 4
  attention_heads: 4
  kv_heads: null
  intermediate_dim: null
  dropout: 0.1
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 100
  batch_size: 32
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  muon_momentum: 0.95
  muon_ns_steps: 5
  lr_schedule: constant
  lr_warmup_steps: 0
  min_learning_rate: 0.0
  validation_fraction: 0.1
  eval_interval: 20
  max_eval_batches: null
  seed: 7
  device: auto
  precision: auto
  distributed_strategy: ddp
  gradient_accumulation_steps: 1
  compile: false
  compile_mode: default
  attention_backend: auto
  checkpoint_interval: null
  resume_from_checkpoint: null
  mlflow_enabled: true
  mlflow_experiment: mega-trading
  mlflow_tracking_uri: null
  progress_bar: true

eval:
  rollouts: 8
  generated_tokens: 128
  device: auto
