defaults:
  - _self_

run:
  run_id: smoke

data:
  data_dir: .mega-trading/public
  mixture: public
  source: yahoo

build:
  block_size: 128
  stride: 64
  min_events_per_ticker: 32
  max_tickers: null

model:
  hidden_dim: 128
  layers: 4
  attention_heads: 4
  dropout: 0.1

training:
  max_steps: 100
  batch_size: 32
  learning_rate: 0.0003
  validation_fraction: 0.1
  eval_interval: 20
  seed: 7
  device: auto
  precision: auto
  wandb_enabled: true
  wandb_project: mega-trading
  wandb_entity: null
  wandb_mode: offline
  progress_bar: true

eval:
  rollouts: 8
  generated_tokens: 128
  device: auto
