[ingest]
output_dir = ".mega-trading/public"
sec_user_agent = "Mega-Trading your-email@example.com"

[ingest.quality]
enabled = true
fail_on_error = false

[ingest.enrichment]
enabled = true

[ingest.training_data]
enabled = true
mixture_name = "public"
sequence_length = 32
input_window_observations = 60
horizon_observations = 20
return_threshold = 0.02

[[ingest.sources]]
name = "sec_companyfacts"
tickers = ["AAPL", "AMZN", "MSFT", "GOOGL", "META", "NVDA", "TSLA", "JPM", "UNH", "XOM"]

[[ingest.sources]]
name = "yahoo_prices"
tickers = ["AAPL", "AMZN", "MSFT", "GOOGL", "META", "NVDA", "TSLA", "JPM", "UNH", "XOM"]
start = "2020-01-01"
end = "2025-12-31"
