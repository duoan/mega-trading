[ingest]
output_dir = ".mega-trading/public"
sec_user_agent = "Mega-Trading your-email@example.com"

[ingest.quality]
enabled = true
fail_on_error = false

[ingest.enrichment]
enabled = true

[ingest.training_data]
enabled = true
mixture_name = "public"
sequence_length = 32
input_window_observations = 60
horizon_observations = 20
return_threshold = 0.02
workers = 8

[[ingest.sources]]
name = "sec_companyfacts"
ticker_file = "universes/sp500.txt"

[[ingest.sources]]
name = "yahoo_prices"
ticker_file = "universes/sp500.txt"
start = "2015-01-01"
end = "2026-05-08"
