defaults:
  - _self_

run:
  run_id: modal-paper-500m

data:
  data_dir: /data/hf-1m-paper
  mixture: paper_target
  source: hf_ohlcv_1m

build:
  block_size: 1024
  stride: 512
  min_events_per_ticker: 4096
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4

model:
  hidden_dim: 1536
  layers: 20
  attention_heads: 24
  kv_heads: 8
  intermediate_dim: 4096
  dropout: 0.05
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 80000
  batch_size: 4
  learning_rate: 0.00015
  validation_fraction: 0.02
  eval_interval: 1000
  seed: 7
  device: cuda
  precision: mixed
  distributed_strategy: fsdp
  gradient_accumulation_steps: 8
  compile: true
  compile_mode: reduce-overhead
  attention_backend: flash
  checkpoint_interval: 2000
  resume_from_checkpoint: null
  wandb_enabled: true
  wandb_project: mega-trading
  wandb_entity: null
  wandb_mode: online
  progress_bar: true

eval:
  rollouts: 64
  generated_tokens: 1024
  device: cuda
