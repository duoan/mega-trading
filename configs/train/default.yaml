defaults:
  - _self_

data:
  data_dir: .mega-trading/public
  mixture: public

run:
  run_id: trading-foundation-model

model:
  hidden_dim: 32
  attention_heads: 4
  market_window_size: null
  news_size: null
  sec_filing_size: null
  earnings_size: null
  macro_size: null
  use_market_data: true
  use_news: true
  use_sec_filings: true
  use_earnings: true
  use_macro: true

training:
  max_steps: 200
  batch_size: 32
  learning_rate: 0.001
  validation_fraction: 0.2
  eval_interval: 10
  seed: 7
  device: auto
  precision: auto
