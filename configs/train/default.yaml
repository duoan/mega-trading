defaults:
  - _self_

data:
  data_dir: .mega-trading/public
  mixture: public

run:
  run_id: trading-foundation-model

model:
  hidden_dim: 32
  attention_heads: 4
  price_window_size: null
  fundamental_size: null
  evidence_size: null
  use_price: true
  use_fundamentals: true
  use_evidence: true

training:
  max_steps: 200
  batch_size: 32
  learning_rate: 0.001
  validation_fraction: 0.2
  eval_interval: 10
  seed: 7
  device: cpu
