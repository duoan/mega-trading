defaults:
  - _self_

ablation_id: public-modality-ablation
train_config_dir: configs/train
train_config_name: default
report_path: .mega-trading/public/reports/ablation-summary.json

base_overrides:
  - training.max_steps=5
  - training.batch_size=8
  - model.hidden_dim=32

runs:
  - name: market_data_only
    overrides:
      - run.run_id=ablation-market_data-only
      - model.use_market_data=true
      - model.use_news=false
      - model.use_sec_filings=false
      - model.use_earnings=false
      - model.use_macro=false
  - name: sec_filings_only
    overrides:
      - run.run_id=ablation-sec_filings-only
      - model.use_market_data=false
      - model.use_news=false
      - model.use_sec_filings=true
      - model.use_earnings=false
      - model.use_macro=false
  - name: market_data_sec_filings
    overrides:
      - run.run_id=ablation-market-data-sec-filings
      - model.use_market_data=true
      - model.use_news=false
      - model.use_sec_filings=true
      - model.use_earnings=false
      - model.use_macro=false
  - name: all_modalities
    overrides:
      - run.run_id=ablation-all-modalities
      - model.use_market_data=true
      - model.use_news=true
      - model.use_sec_filings=true
      - model.use_earnings=true
      - model.use_macro=true
