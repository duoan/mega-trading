defaults:
  - _self_

run:
  run_id: binance-modal-prep

data:
  data_dir: .mega-trading/binance-modal
  mixture: binance_public
  source: binance_trades

build:
  block_size: 512
  stride: 256
  min_events_per_ticker: 4096
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4
  numpy_partition_rows: 16384
  validation_fraction: 0.02
  backtest_fraction: 0.10
  streaming_prepare: true
  streaming_tokenizer_sample_events: 250000
  streaming_baseline_sample_rows: 200000

model:
  hidden_dim: 512
  layers: 12
  attention_heads: 8
  kv_heads: 2
  intermediate_dim: 1408
  dropout: 0.05
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 1
  batch_size: 16
  learning_rate: 0.0002
  optimizer: adamw
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  muon_momentum: 0.95
  muon_ns_steps: 5
  lr_schedule: constant
  lr_warmup_steps: 0
  min_learning_rate: 0.0
  validation_fraction: 0.02
  eval_interval: 1
  max_eval_batches: null
  seed: 7
  device: cpu
  precision: fp32
  distributed_strategy: ddp
  gradient_accumulation_steps: 1
  compile: false
  compile_mode: default
  attention_backend: auto
  checkpoint_interval: null
  resume_from_checkpoint: null
  mlflow_enabled: false
  mlflow_experiment: mega-trading
  mlflow_tracking_uri: null
  progress_bar: true

eval:
  rollouts: 8
  generated_tokens: 128
  device: cpu
