defaults:
  - _self_

run:
  run_id: binance-modal-prep

data:
  data_dir: .mega-trading/binance-modal
  mixture: binance_public
  source: binance_trades

build:
  block_size: 512
  stride: 256
  min_events_per_ticker: 4096
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4

model:
  hidden_dim: 512
  layers: 12
  attention_heads: 8
  kv_heads: 2
  intermediate_dim: 1408
  dropout: 0.05
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 1
  batch_size: 16
  learning_rate: 0.0002
  validation_fraction: 0.02
  eval_interval: 1
  seed: 7
  device: cpu
  precision: fp32
  distributed_strategy: ddp
  gradient_accumulation_steps: 1
  compile: false
  compile_mode: default
  attention_backend: auto
  checkpoint_interval: null
  resume_from_checkpoint: null
  wandb_enabled: false
  wandb_project: mega-trading
  wandb_entity: null
  wandb_mode: disabled
  progress_bar: true

eval:
  rollouts: 8
  generated_tokens: 128
  device: cpu
