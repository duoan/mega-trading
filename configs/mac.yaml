defaults:
  - _self_

run:
  run_id: mac

data:
  data_dir: .mega-trading/data
  mixture: mac
  source: binance_trades

build:
  block_size: 128
  stride: 64
  min_events_per_ticker: 512
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4
  numpy_partition_rows: 8192
  validation_fraction: 0.05
  backtest_fraction: 0.10
  streaming_prepare: true
  streaming_tokenizer_sample_events: 100000
  streaming_baseline_sample_rows: 100000

model:
  hidden_dim: 192
  layers: 6
  attention_heads: 6
  kv_heads: 2
  intermediate_dim: 512
  dropout: 0.1
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 300
  batch_size: 16
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  muon_momentum: 0.95
  muon_ns_steps: 5
  lr_schedule: constant
  lr_warmup_steps: 0
  min_learning_rate: 0.0
  validation_fraction: 0.05
  eval_interval: 50
  max_eval_batches: 16
  metric_interval: 1
  preload_numpy_arrays: false
  dataloader_num_workers: 0
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  seed: 7
  device: mps
  precision: fp32
  distributed_strategy: ddp
  gradient_accumulation_steps: 1
  compile: false
  compile_mode: default
  attention_backend: auto
  checkpoint_interval: 100
  resume_from_checkpoint: null
  mlflow_enabled: true
  mlflow_experiment: mega-trading
  mlflow_tracking_uri: null
  progress_bar: true
  profiler_enabled: false
  nvtx_enabled: false
  profiler_trace_dir: null
  profiler_wait_steps: 1
  profiler_warmup_steps: 1
  profiler_active_steps: 3
  profiler_repeat: 1
  profiler_record_shapes: false
  profiler_profile_memory: false
  profiler_with_stack: false

eval:
  rollouts: 8
  generated_tokens: 128
  device: mps
