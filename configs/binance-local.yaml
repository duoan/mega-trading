defaults:
  - _self_

run:
  run_id: binance-local

data:
  data_dir: .mega-trading/binance-local
  mixture: binance_local
  source: binance_trades

build:
  block_size: 128
  stride: 64
  min_events_per_ticker: 512
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4
  numpy_partition_rows: 8192
  validation_fraction: 0.05
  backtest_fraction: 0.10

model:
  hidden_dim: 192
  layers: 6
  attention_heads: 6
  kv_heads: 2
  intermediate_dim: 512
  dropout: 0.1
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 300
  batch_size: 16
  learning_rate: 0.0003
  validation_fraction: 0.05
  eval_interval: 50
  max_eval_batches: 16
  seed: 7
  device: mps
  precision: fp32
  distributed_strategy: ddp
  gradient_accumulation_steps: 1
  compile: false
  compile_mode: default
  attention_backend: auto
  checkpoint_interval: 100
  resume_from_checkpoint: null
  wandb_enabled: true
  wandb_project: mega-trading
  wandb_entity: null
  wandb_mode: offline
  progress_bar: true

eval:
  rollouts: 8
  generated_tokens: 128
  device: mps
