defaults:
  - _self_

run:
  run_id: rtx

data:
  data_dir: .mega-trading/data
  mixture: rtx
  source: binance_trades

build:
  block_size: 512
  stride: 256
  min_events_per_ticker: 4096
  max_tickers: null
  tokenizer_method: quantile
  tokenizer_clip_quantile: 0.01
  tokenizer_relative_price_bins: 8
  tokenizer_price_bins: 8
  tokenizer_size_bins: 8
  tokenizer_time_bins: 4
  numpy_partition_rows: 16384
  validation_fraction: 0.02
  backtest_fraction: 0.10
  streaming_prepare: true
  streaming_tokenizer_sample_events: 250000
  streaming_baseline_sample_rows: 200000

model:
  hidden_dim: 1024
  layers: 20
  attention_heads: 16
  kv_heads: 4
  intermediate_dim: 2816
  # The local Triton attention path currently fuses causal GQA without dropout.
  dropout: 0.0
  rope_theta: 500000.0
  norm_eps: 0.00001

training:
  max_steps: 20000
  batch_size: 8
  learning_rate: 0.0002
  optimizer: muon
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  muon_momentum: 0.95
  muon_ns_steps: 5
  lr_schedule: cosine
  lr_warmup_steps: 1000
  min_learning_rate: 0.00002
  validation_fraction: 0.02
  eval_interval: 500
  max_eval_batches: 64
  # Expensive top-k/CPU-sync metrics run only every N steps, plus eval/checkpoint/final steps.
  metric_interval: 10
  seed: 7
  device: cuda
  precision: mixed
  distributed_strategy: ddp
  gradient_accumulation_steps: 8
  compile: true
  # default avoids torch.compile CUDA-graph capture that conflicts with Accelerate backward on single-GPU DDP.
  compile_mode: default
  attention_backend: triton
  checkpoint_interval: 1000
  resume_from_checkpoint: null
  mlflow_enabled: true
  mlflow_experiment: mega-trading
  mlflow_tracking_uri: null
  progress_bar: true
  # Enable with: training.profiler_enabled=true, then open runs/rtx/profiler in TensorBoard.
  profiler_enabled: false
  # Enable with Nsight Systems: training.nvtx_enabled=true for train/* timeline ranges.
  nvtx_enabled: false
  profiler_trace_dir: null
  profiler_wait_steps: 2
  profiler_warmup_steps: 2
  profiler_active_steps: 4
  profiler_repeat: 1
  profiler_record_shapes: false
  profiler_profile_memory: false
  profiler_with_stack: false

eval:
  rollouts: 32
  generated_tokens: 512
  device: cuda
