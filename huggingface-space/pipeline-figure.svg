<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Mega-Trading architecture figure</title>
  <desc id="desc">A paper-style figure showing the data plane, tokenization, model core, training and evaluation, and inference outputs for Mega-Trading.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="model" x1="0" x2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#shadow); }
      .subpanel { fill: #f8fafc; stroke: #d8e2ef; stroke-width: 1.2; }
      .modelBox { fill: url(#model); stroke: #93c5fd; stroke-width: 1.5; }
      .title { font: 800 30px Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.02em; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #dbeafe; }
      .section { font: 800 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 12px Inter, Arial, sans-serif; fill: #2563eb; letter-spacing: 0.08em; }
      .text { font: 500 13px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 11.5px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .metric { font: 800 22px Inter, Arial, sans-serif; fill: #0f172a; }
      .caption { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .chip { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" rx="30"/>
  <rect x="28" y="26" width="1344" height="86" rx="22" fill="url(#header)"/>
  <text class="title" x="58" y="64">Mega-Trading: public trade flow to generative order-flow scenarios</text>
  <text class="subtitle" x="58" y="92">Default RTX path: Binance public trades -> paper-style event contract -> composite tokenizer -> Llama-style decoder -> backtest and inference artifacts</text>

  <!-- Data plane -->
  <rect class="panel" x="38" y="148" width="250" height="430" rx="22"/>
  <text class="label" x="62" y="180">(a) DATA PLANE</text>
  <text class="section" x="62" y="207">Default source</text>
  <rect class="subpanel" x="62" y="226" width="202" height="94" rx="16"/>
  <text class="text" x="82" y="254">Binance public trades</text>
  <text class="small" x="82" y="279">32 liquid USDT symbols</text>
  <text class="small" x="82" y="300">2023-05 to 2026-04</text>
  <text class="section" x="62" y="357">Paper-style fields</text>
  <rect class="subpanel" x="62" y="376" width="202" height="156" rx="16"/>
  <text class="mono" x="82" y="405">action, side</text>
  <text class="mono" x="82" y="429">relative_price_bps</text>
  <text class="mono" x="82" y="453">price_depth_bps</text>
  <text class="mono" x="82" y="477">relative size</text>
  <text class="mono" x="82" y="501">interarrival time</text>
  <text class="small" x="62" y="552">Causal normalization preserves replay lineage.</text>

  <!-- Tokenization -->
  <rect class="panel" x="330" y="148" width="250" height="430" rx="22"/>
  <text class="label" x="354" y="180">(b) TOKENIZATION</text>
  <text class="section" x="354" y="207">Composite event token</text>
  <rect class="subpanel" x="354" y="226" width="202" height="92" rx="16"/>
  <text class="mono" x="376" y="257">token = f(a,s,r,d,z,dt)</text>
  <text class="small" x="376" y="282">one complete event per ID</text>
  <text class="section" x="354" y="356">Fitted bins</text>
  <rect class="subpanel" x="354" y="376" width="202" height="156" rx="16"/>
  <text class="text" x="376" y="406">quantile method</text>
  <text class="small" x="376" y="430">clip quantile: 0.01</text>
  <text class="small" x="376" y="454">vocabulary: 579 IDs</text>
  <text class="small" x="376" y="478">block size: 512</text>
  <text class="small" x="376" y="502">stride: 256</text>
  <text class="small" x="354" y="552">Tokenizer metadata makes inference auditable.</text>

  <!-- Model core -->
  <rect class="panel" x="622" y="148" width="330" height="430" rx="22"/>
  <text class="label" x="646" y="180">(c) MODEL CORE</text>
  <text class="section" x="646" y="207">Llama 3-style causal decoder</text>
  <rect class="modelBox" x="652" y="236" width="274" height="64" rx="16"/>
  <text class="text" x="682" y="264">token embedding + tied logits</text>
  <text class="small" x="682" y="286">579 x 1024 learned table</text>
  <path class="arrowBlue" d="M789 302 V326"/>
  <rect class="modelBox" x="652" y="328" width="274" height="112" rx="16"/>
  <text class="text" x="682" y="358">20 x decoder blocks</text>
  <text class="small" x="682" y="383">RMSNorm + RoPE + causal GQA</text>
  <text class="small" x="682" y="407">SwiGLU feed-forward</text>
  <text class="small" x="682" y="428">hidden=1024, heads=16, kv=4</text>
  <path class="arrowBlue" d="M789 443 V468"/>
  <rect class="modelBox" x="652" y="470" width="274" height="62" rx="16"/>
  <text class="text" x="682" y="498">next-token distribution</text>
  <text class="small" x="682" y="518">~226M trainable parameters</text>

  <!-- Training and evaluation -->
  <rect class="panel" x="994" y="148" width="360" height="430" rx="22"/>
  <text class="label" x="1018" y="180">(d) TRAINING AND EVALUATION</text>
  <rect class="subpanel" x="1018" y="208" width="150" height="130" rx="16"/>
  <text class="section" x="1040" y="238">Training</text>
  <text class="small" x="1040" y="266">Muon + AdamW routing</text>
  <text class="small" x="1040" y="289">cosine LR schedule</text>
  <text class="small" x="1040" y="312">Triton + torch.compile</text>
  <rect class="subpanel" x="1184" y="208" width="146" height="130" rx="16"/>
  <text class="section" x="1206" y="238">Artifacts</text>
  <text class="small" x="1206" y="266">checkpoint.pt</text>
  <text class="small" x="1206" y="289">manifest JSON</text>
  <text class="small" x="1206" y="312">MLflow metrics</text>
  <rect class="subpanel" x="1018" y="370" width="312" height="162" rx="16"/>
  <text class="section" x="1040" y="402">RTX backtest snapshot</text>
  <text class="metric" x="1040" y="438">2.3379</text>
  <text class="small" x="1120" y="438">loss</text>
  <text class="metric" x="1040" y="478">10.3592</text>
  <text class="small" x="1144" y="478">perplexity</text>
  <text class="metric" x="1040" y="518">49.23% / 69.42%</text>
  <text class="small" x="1225" y="518">top-1 / top-5</text>

  <!-- Output lane -->
  <rect class="panel" x="330" y="628" width="1024" height="118" rx="22"/>
  <text class="label" x="354" y="660">(e) INFERENCE OUTPUTS</text>
  <rect class="chip" x="354" y="682" width="190" height="38" rx="19"/>
  <text class="text" x="377" y="706">top-k token rollouts</text>
  <rect class="chip" x="570" y="682" width="216" height="38" rx="19"/>
  <text class="text" x="593" y="706">decoded event features</text>
  <rect class="chip" x="812" y="682" width="214" height="38" rx="19"/>
  <text class="text" x="835" y="706">price-depth scenarios</text>
  <rect class="chip" x="1052" y="682" width="236" height="38" rx="19"/>
  <text class="text" x="1075" y="706">HTML + technical report</text>

  <!-- Split inset -->
  <rect x="38" y="628" width="250" height="118" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <text class="label" x="62" y="660" fill="#c2410c">CHRONOLOGICAL SPLIT</text>
  <text class="text" x="62" y="690">54.7M train</text>
  <text class="text" x="62" y="715">1.1M validation</text>
  <text class="text" x="62" y="740">6.2M backtest</text>

  <!-- Arrows -->
  <path class="arrow" d="M288 363 H322"/>
  <path class="arrow" d="M580 363 H614"/>
  <path class="arrow" d="M952 363 H986"/>
  <path class="arrowBlue" d="M1174 338 V360"/>
  <path class="arrowBlue" d="M789 532 C789 595 842 592 842 624"/>
  <path class="arrowBlue dash" d="M1174 532 C1174 598 1030 596 1030 624"/>
  <path class="arrow dash" d="M163 578 V620"/>

  <text class="caption" x="38" y="790">Figure: The static Space poster uses the local RTX artifacts. The current system is an open-loop public-data MVP; closed-loop L3 simulation is a future evaluation layer.</text>
</svg>
