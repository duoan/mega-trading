<text x="69.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 69.0 252)">one/micro</text>
<rect x="104" y="62.0" width="34" height="170.0" rx="6" fill="#14b8a6"/>
<text x="121.0" y="56.0" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">62.1%</text>
<text x="121.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 121.0 252)">one/small</text>
<rect x="156" y="148.8" width="34" height="83.2" rx="6" fill="#93c5fd"/>
<text x="173.0" y="142.8" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">30.4%</text>
<text x="173.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 173.0 252)">two/micro</text>
<rect x="208" y="230.9" width="34" height="1.1" rx="6" fill="#3b82f6"/>
<text x="225.0" y="224.9" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">0.4%</text>
<text x="225.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 225.0 252)">two/small</text>
<rect x="260" y="218.0" width="34" height="14.0" rx="6" fill="#fbbf24"/>
<text x="277.0" y="212.0" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">5.1%</text>
<text x="277.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 277.0 252)">small_100</text>
</g>
<text x="28" y="402" fill="#475569" font-size="12">Conclusion: small beats micro on the one-ticker slice; adding a second ticker is harder; the 100-step follow-up improves loss but worsens price-depth L1, so selection must monitor both open-loop and rollout metrics.</text>
</svg>