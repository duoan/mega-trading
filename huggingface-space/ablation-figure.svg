<text x="173.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 173.0 252)">two/micro</text>
<rect x="208" y="212.5" width="34" height="19.5" rx="6" fill="#3b82f6"/>
<text x="225.0" y="206.5" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">0.141</text>
<text x="225.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 225.0 252)">two/small</text>
<rect x="260" y="121.2" width="34" height="110.8" rx="6" fill="#fbbf24"/>
<text x="277.0" y="115.2" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">0.801</text>
<text x="277.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 277.0 252)">small_100</text>
</g>
<g transform="translate(743,105)">
<rect x="0" y="0" width="330" height="270" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
<text x="18" y="28" fill="#0f172a" font-size="15" font-weight="800">Top-1 accuracy</text>
<text x="18" y="48" fill="#64748b" font-size="11">higher is better (%)</text>
<line x1="42" y1="62.0" x2="312" y2="62.0" stroke="#e2e8f0"/>
<line x1="42" y1="117.0" x2="312" y2="117.0" stroke="#e2e8f0"/>
<line x1="42" y1="172.0" x2="312" y2="172.0" stroke="#e2e8f0"/>
