<rect x="52" y="126.8" width="34" height="105.2" rx="6" fill="#5eead4"/>
<text x="69.0" y="120.8" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">3.06</text>
<text x="69.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 69.0 252)">one/micro</text>
<rect x="104" y="159.3" width="34" height="72.7" rx="6" fill="#14b8a6"/>
<text x="121.0" y="153.3" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">2.11</text>
<text x="121.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 121.0 252)">one/small</text>
<rect x="156" y="67.9" width="34" height="164.1" rx="6" fill="#93c5fd"/>
<text x="173.0" y="61.9" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">4.77</text>
<text x="173.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 173.0 252)">two/micro</text>
<rect x="208" y="62.0" width="34" height="170.0" rx="6" fill="#3b82f6"/>
<text x="225.0" y="56.0" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">4.94</text>
<text x="225.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 225.0 252)">two/small</text>
<rect x="260" y="88.7" width="34" height="143.3" rx="6" fill="#fbbf24"/>
<text x="277.0" y="82.7" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">4.17</text>
<text x="277.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 277.0 252)">small_100</text>
</g>
<g transform="translate(373,105)">
<rect x="0" y="0" width="330" height="270" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
<text x="18" y="28" fill="#0f172a" font-size="15" font-weight="800">Price-depth L1</text>
<text x="18" y="48" fill="#64748b" font-size="11">lower is better</text>
<line x1="42" y1="62.0" x2="312" y2="62.0" stroke="#e2e8f0"/>
