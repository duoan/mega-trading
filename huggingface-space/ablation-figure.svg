<line x1="42" y1="282.0" x2="312" y2="282.0" stroke="#e2e8f0"/>
<rect x="52" y="144.6" width="34" height="87.4" rx="6" fill="#5eead4"/>
<text x="69.0" y="138.6" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">0.632</text>
<text x="69.0" y="252" text-anchor="middle" fill="#475569" font-size="9" transform="rotate(28 69.0 252)">one/micro</text>
<rect x="104" y="211.8" width="34" height="20.2" rx="6" fill="#14b8a6"/>
