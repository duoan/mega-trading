<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 430" role="img" aria-label="Ablation study charts for backtest loss, price-depth L1, and Top-1 accuracy">
<rect width="1110" height="430" rx="24" fill="#f8fafc"/>
<text x="28" y="38" fill="#0f172a" font-size="20" font-weight="800">Ablation study: capacity, data size, and training budget</text>
<text x="28" y="64" fill="#475569" font-size="13">Hypothesis: larger models should improve likelihood, but multi-ticker data and longer training must be judged with both token metrics and rollout facts.</text>
<g transform="translate(3,105)">
<rect x="0" y="0" width="330" height="270" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
<text x="18" y="28" fill="#0f172a" font-size="15" font-weight="800">Backtest loss</text>
<text x="18" y="48" fill="#64748b" font-size="11">lower is better</text>
<line x1="42" y1="62.0" x2="312" y2="62.0" stroke="#e2e8f0"/>
<line x1="42" y1="117.0" x2="312" y2="117.0" stroke="#e2e8f0"/>
